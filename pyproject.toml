[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "scientific-gsplat-renderer"
version = "0.1.0"
description = "Scientific Gaussian splatting renderer for saved Gaussian mixture models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Md. Robiul Islam" }
]

dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "matplotlib>=3.7",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 88
target-version = "py310"


[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true