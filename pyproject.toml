[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-gsplat-renderer"
version = "0.1.0"
description = "GPU-accelerated scientific Gaussian splatting for cosmological particle data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Md Robiul Islam"}
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.7",
    "viser",
    "imageio",
]

[project.optional-dependencies]
benchmark = [
    "matplotlib",
    "scikit-image",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
